# Deploys the web version to Cloudflare Pages on every push to main, from the
# same commit and version the CLI is built from.
#
# Setup (once, by a maintainer):
#   1. Create a Cloudflare Pages project (Direct Upload) and an API token with
#      the "Cloudflare Pages: Edit" permission only.
#   2. In GitHub: Settings > Environments > New environment "cloudflare-pages".
#      Restrict it to the main branch and, optionally, require a reviewer.
#   3. In that environment add secrets CLOUDFLARE_API_TOKEN and
#      CLOUDFLARE_ACCOUNT_ID, and a variable CLOUDFLARE_PAGES_PROJECT.
# Until the variable exists, the deploy job is skipped.
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check configuration
        id: config
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -z "$PROJECT" ]; then
            echo "::notice::CLOUDFLARE_PAGES_PROJECT is not set in the cloudflare-pages environment; skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.enabled == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0 # for the version from git describe
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.config.outputs.enabled == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: Test and build
        if: steps.config.outputs.enabled == 'true'
        run: make test web

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.config.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          npx --yes wrangler@4.155.0 pages deploy web/dist \
            --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA" | tee deploy.log
          echo "url=$(grep -oE 'https://[^ ]+\.pages\.dev' deploy.log | tail -1)" >> "$GITHUB_OUTPUT"
