# Parody of a terminal coding agent with a bold banner. Original wording.
name: grok
title: Groan CLI
version: v0.3.7
accent: "#E5E5E5"

welcome:
  - banner:
      text: "GROAN"
      gradient: ["#FFFFFF", "#8A8A8A"]
  - text:
      - "{title} {version} · model: groan-4-heavy-ish · {cwd}"
  - list:
      title: "Commands:"
      items:
        - "run <topic> - start working on a topic"
        - "help - list all commands"
        - "esc - interrupt the current task"

live:
  - status: { idle: "mode: auto" }
  - input: { style: ruled, marker: "▶" }
  - footer:
      highlight: "auto mode"
      left: "esc to stop · ctrl+c to leave"

tools: boxed
spinner: ["◢", "◣", "◤", "◥"]
thinking_words:
  - Thinking hard
  - Reasoning
  - Inspecting the code
  - Weighing options
  - Writing the patch
  - Double-checking
done_messages:
  - "Done. The fix was smaller than expected; tests are green."
  - "Fixed. I added a test so this does not regress."
  - "Done. Changes are ready to commit."
stopped_message: "Stopped. What would you like to do next?"
