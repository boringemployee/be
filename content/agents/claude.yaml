# Parody of a terminal coding agent. Mimics the layout with original art and wording.
name: claude
title: Clock Code
version: v0.4.2
accent: "#D97757"

welcome:
  - header:
      art:
        - " ▄▀▀▀▄ "
        - "█  █▄ █"
        - " ▀▄▄▄▀ "
      lines:
        - "{title} {version}"
        - "Magnum Opus 5 (1M context) with high effort · Team"
        - "{cwd}"
  - notice:
      - "Accept-edits mode is now {title}'s default permission mode."
      - "{title} applies file edits automatically and asks before running commands it has not seen before. Review changes in your diff as usual."
      - "Type 'run <topic>' to start a task, or 'help' for commands."

live:
  - status: { idle: "○ low · /effort" }
  - input: { style: ruled, marker: "❯" }
  - footer:
      highlight: "▸▸ accept edits on"
      left: "(shift+tab to switch) · esc to interrupt"

tools: boxed
spinner: ["◐", "◓", "◑", "◒"]
thinking_words:
  - Pondering
  - Ruminating
  - Percolating
  - Noodling
  - Synthesizing
  - Cogitating
  - Marinating
  - Contemplating the codebase
  - Tracing call sites
done_messages:
  - "Done. All tests pass and the change is ready for review."
  - "Finished. The change is small and focused; no behavior changes outside this module."
  - "Complete. I also removed two unused helpers in the same file."
  - "All set. Moving on to the next item."
stopped_message: "Interrupted. What should I do instead?"
