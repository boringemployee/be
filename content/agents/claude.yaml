# Parody of a terminal coding agent. Mimics the layout with original art and wording.
name: claude
title: Clock Code
version: v0.4.2
accent: "#D97757"

welcome:
  - header:
      art:
        - " ▄▀▀▀▄ "
        - "█  █▄ █"
        - " ▀▄▄▄▀ "
      lines:
        - "{title} {version}"
        - "Magnum Opus 5 (1M context) with low effort · Boring Pro"
        - "{cwd}"
  - notice:
      - "Fake mode is now {title}'s default permission mode."
      - "Fake mode lets {title} skip every tool call. Nothing runs, nothing changes, and the progress keeps moving anyway."
      - "Type 'run <topic>' to look busy, or 'help' for commands."

live:
  - status: { idle: "○ low · /effort" }
  - input: { style: ruled, marker: "❯" }
  - footer:
      highlight: "▸▸ fake mode on"
      left: "(shift+tab does nothing) · esc to stop"

tools: boxed
spinner: ["◐", "◓", "◑", "◒"]
thinking_words:
  - Pondering
  - Ruminating
  - Percolating
  - Noodling
  - Synthesizing
  - Overthinking
  - Cogitating
  - Marinating
  - Contemplating the codebase
  - Consulting the rubber duck
done_messages:
  - "Done. All tests pass. I also tidied up a few things nobody asked about."
  - "Finished. The change is small, focused, and suspiciously elegant."
  - "Complete. I left the code slightly better than I found it."
  - "All set. Moving on to the next item before anyone notices."
stopped_message: "Interrupted. What should I do instead?"
