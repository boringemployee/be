tasks:
  - "Review permissions for {module}"
  - "Tighten the network policy for {module}"
  - "Rotate the API keys used by {module}"
files:
  - config/permissions.yaml
  - deploy/policies/network.yaml
  - deploy/policies/pod-security.yaml
commands:
  - run: trivy config deploy
    output:
      - "Tests: 41 (SUCCESSES: 41, FAILURES: 0)"
    failure:
      - "{file} (kubernetes)"
      - "Tests: 41 (SUCCESSES: 40, FAILURES: 1)"
      - "HIGH: Container should not be privileged"
  - run: conftest test deploy/policies
    output:
      - "5 tests, 5 passed, 0 warnings, 0 failures, 0 exceptions"
    failure:
      - "FAIL - {file} - network policy allows all ingress"
      - "5 tests, 4 passed, 0 warnings, 1 failure, 0 exceptions"
edits:
  - from: "role: admin"
    to: "role: read-only"
  - from: "allowPrivilegeEscalation: true"
    to: "allowPrivilegeEscalation: false"
  - to: "readOnlyRootFilesystem: true"
  - from: "  - from: [] # allow all"
    to: "  - from: [{ podSelector: { matchLabels: { app: api } } }]"
  - from: "keyRotationDays: 365"
    to: "keyRotationDays: 90"
