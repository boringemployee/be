tasks:
  - "Triage the open dependency alerts for {module}"
  - "Upgrade the vulnerable packages in {file}"
  - "Generate an SBOM for {module}"
  - "Remove unused dependencies from {module}"
  - "Fix the license policy violation in {module}"
files:
  - package.json
  - package-lock.json
  - requirements.txt
  - go.mod
  - poetry.lock
commands:
  - run: npm audit --omit=dev
    output:
      - "found 0 vulnerabilities"
    failure:
      - "# npm audit report"
      - "semver  <7.5.2"
      - "Severity: high"
      - "Regular Expression Denial of Service - fix available via `npm audit fix`"
      - "1 high severity vulnerability"
  - run: pip-audit -r requirements.txt
    output:
      - "No known vulnerabilities found"
    failure:
      - "Name     Version ID                  Fix Versions"
      - "-------- ------- ------------------- ------------"
      - "jinja2   3.1.3   GHSA-h75v-3vvj-5mfj 3.1.4"
      - "Found 1 known vulnerability in 1 package"
  - run: syft . -o table
    output:
      - " ✔ Indexed file system"
      - " ✔ Cataloged contents  [612 packages]"
      - "NAME              VERSION   TYPE"
      - "express           4.21.2    npm"
      - "golang.org/x/net  v0.36.0   go-module"
  - run: npx depcheck
    output:
      - "No depcheck issue"
    failure:
      - "Unused dependencies"
      - "* moment"
      - "* request"
edits:
  - from: "\"semver\": \"^7.3.8\","
    to: "\"semver\": \"^7.6.3\","
  - from: "jinja2==3.1.3"
    to: "jinja2==3.1.4"
  - from: "\"moment\": \"^2.29.4\","
    to: "\"dayjs\": \"^1.11.13\","
  - from: "golang.org/x/crypto v0.31.0"
    to: "golang.org/x/crypto v0.35.0"
  - to: "\"overrides\": { \"semver\": \"^7.6.3\" },"
  - from: "requests>=2.0"
    to: "requests==2.32.3"
