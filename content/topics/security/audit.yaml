tasks:
  - "Patch the vulnerable dependency in {module}"
  - "Add input validation to {file}"
  - "Rotate the API keys used by {module}"
  - "Enable stricter headers for {module}"
  - "Review permissions for {module}"
  - "Fix the finding reported by {test}"
files:
  - internal/auth/login.go
  - internal/api/middleware.go
  - config/permissions.yaml
  - package-lock.json
  - go.sum
  - deploy/policies/network.yaml
modules:
  - auth-service
  - payments-api
  - admin-portal
  - file-uploads
tests:
  - TestLoginRateLimit
  - TestCSRFProtection
  - TestPathTraversal
  - dependency-audit
commands:
  - npm audit
  - govulncheck ./...
  - trivy fs .
  - make security-scan
logs:
  - "found 0 vulnerabilities"
  - "No vulnerabilities found."
  - "scanning {file}"
  - "1 low severity issue (accepted risk)"
  - "secrets scan: clean"
  - "updated 3 dependencies"
edits:
  - "if !limiter.Allow(ip) {"
  - "    return ErrTooManyRequests"
  - "w.Header().Set(\"X-Content-Type-Options\", \"nosniff\")"
  - "role: read-only"
  - "path = filepath.Clean(path)"
  - "token, err := secrets.Load(\"payments\")"
  - "// TODO: threat model this"
