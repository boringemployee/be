tasks:
  - "Roll the {module} forecast forward one quarter"
  - "Update the headcount assumptions in {file}"
  - "Build a downside scenario for {module}"
  - "Reconcile the forecast in {file} with the sales pipeline"
  - "Split the {module} budget by cost center"
files:
  - fpa/forecast_2027.xlsx
  - fpa/headcount_plan.xlsx
  - fpa/cash_runway.xlsx
  - fpa/scenarios.xlsx
commands:
  - run: python fpa/run_forecast.py --scenario base
    output:
      - "loading assumptions (42 drivers)"
      - "projecting 2027-01 to 2027-12"
      - "revenue 2027:   16.4M (+18% YoY)"
      - "opex 2027:      12.1M"
      - "ending cash:     9.8M"
      - "runway: 31 months"
  - run: python fpa/run_forecast.py --scenario downside
    output:
      - "loading assumptions (42 drivers, 6 overridden)"
      - "revenue 2027:   13.9M (+0% YoY)"
      - "ending cash:     6.2M"
      - "runway: 22 months"
  - run: python fpa/check_model.py {file}
    output:
      - "hard-coded numbers in formulas: 0"
      - "assumptions referenced: 42/42"
      - "model checks passed"
    failure:
      - "hard-coded numbers in formulas: 7"
      - "  Forecast!H14 uses 1.08 instead of Assumptions!C3"
      - "assumptions referenced: 39/42 (3 unused)"
      - "model checks failed"
edits:
  - from: "Growth rate: 22%"
    to: "Growth rate: 18%"
  - from: "Hires in Q1: 6"
    to: "Hires in Q1: 4 (2 moved to Q2)"
  - to: "Downside: churn +2pp, new bookings -25%"
  - from: "=H13*1.08"
    to: "=H13*(1+Assumptions!$C$3)"
  - to: "Cost center 410 Engineering: 61%, 420 Sales: 24%, 430 G&A: 15%"
