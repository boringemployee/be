edits:
  - from: "<button onClick={close}>"
    to: "<button onClick={close} aria-label=\"Close dialog\">"
  - from: "const [open, setOpen] = useState();"
    to: "const [open, setOpen] = useState(false);"
  - from: "useEffect(() => { setOpen(false); });"
    to: "useEffect(() => { setOpen(false); }, [route]);"
  - from: "export default Button;"
    to: "export default memo(Button);"
  - from: "import _ from \"lodash\";"
    to: "import debounce from \"lodash/debounce\";"
  - from: "{items.map(item => <Row item={item} />)}"
    to: "{items.map(item => <Row key={item.id} item={item} />)}"
  - from: "const total = items.reduce((s, i) => s + i.price, 0);"
    to: "const total = useMemo(() => items.reduce((s, i) => s + i.price, 0), [items]);"
  - to: "if (isLoading) return <Spinner label=\"Loading results\" />;"
  - to: "if (error) return <ErrorState onRetry={refetch} />;"
  - from: "const date = new Date().toLocaleString();"
    to: "const date = useClientDate();"
  - from: "<div onClick={toggle}>"
    to: "<button type=\"button\" onClick={toggle} aria-expanded={open}>"
  - from: "setCount(count + 1);"
    to: "setCount(c => c + 1);"
  - from: "const Chart = require(\"./Chart\");"
    to: "const Chart = lazy(() => import(\"./Chart\"));"
